<!DOCTYPE html>
<html>
<head>
<title>Signature Icon Creator</title>
<style>
  body { font-family: 'Segoe UI', Arial, sans-serif; padding: 40px; background: #1a1a1a; color: white; text-align: center; }
  .icons { display: flex; justify-content: center; gap: 40px; margin: 30px 0; flex-wrap: wrap; }
  .icon-item { text-align: center; }
  .icon-item canvas { border: 1px solid #444; display: block; margin: 0 auto 10px; }
  .icon-item .label { font-size: 12px; color: #999; margin-bottom: 6px; }
  .icon-item button { padding: 8px 16px; background: #b22c2e; color: white; border: none; cursor: pointer; font-size: 12px; font-weight: bold; }
  .icon-item button:hover { background: #8f2325; }
  h1 { font-size: 24px; margin-bottom: 8px; }
  p { color: #888; font-size: 14px; margin-bottom: 20px; }
  .preview-row { display: flex; justify-content: center; gap: 60px; margin-top: 30px; }
  .preview-bg { padding: 20px; display: inline-flex; gap: 12px; align-items: center; }
  .preview-label { font-size: 11px; color: #666; margin-top: 8px; }
  button.download-all { padding: 14px 32px; background: #b22c2e; color: white; border: none; cursor: pointer; font-size: 16px; font-weight: bold; margin: 20px; }
</style>
</head>
<body>
  <h1>Email Signature Icon Creator</h1>
  <p>These icons are generated at 96x96 for crisp display at 18x18 in the signature. Download all, upload to Imgur, and paste the direct URLs into the generator.</p>

  <div class="icons">
    <div class="icon-item">
      <canvas id="phoneIcon" width="96" height="96"></canvas>
      <div class="label">Phone</div>
      <button onclick="downloadIcon('phoneIcon', 'icon-phone.png')">Download</button>
    </div>
    <div class="icon-item">
      <canvas id="emailIcon" width="96" height="96"></canvas>
      <div class="label">Email</div>
      <button onclick="downloadIcon('emailIcon', 'icon-email.png')">Download</button>
    </div>
    <div class="icon-item">
      <canvas id="webIcon" width="96" height="96"></canvas>
      <div class="label">Website</div>
      <button onclick="downloadIcon('webIcon', 'icon-web.png')">Download</button>
    </div>
    <div class="icon-item">
      <canvas id="linkedinIcon" width="96" height="96"></canvas>
      <div class="label">LinkedIn</div>
      <button onclick="downloadIcon('linkedinIcon', 'icon-linkedin.png')">Download</button>
    </div>
  </div>

  <button class="download-all" onclick="downloadAll()">Download All Icons</button>

  <div class="preview-row">
    <div>
      <div class="preview-bg" style="background:white;">
        <img id="prev1" width="18" height="18">
        <img id="prev2" width="18" height="18">
        <img id="prev3" width="18" height="18">
        <img id="prev4" width="18" height="18">
      </div>
      <div class="preview-label">Light mode (18px)</div>
    </div>
    <div>
      <div class="preview-bg" style="background:#1a1a1a; border:1px solid #333;">
        <img id="prev5" width="18" height="18">
        <img id="prev6" width="18" height="18">
        <img id="prev7" width="18" height="18">
        <img id="prev8" width="18" height="18">
      </div>
      <div class="preview-label">Dark mode (18px)</div>
    </div>
  </div>

  <script>
    const S = 96;
    const R = S / 2;
    const BG = '#14191c';
    const FG = '#ffffff';

    function drawCircleBg(ctx) {
      ctx.beginPath();
      ctx.arc(R, R, R, 0, Math.PI * 2);
      ctx.fillStyle = BG;
      ctx.fill();
    }

    // ── Phone Icon ──
    function drawPhone() {
      const c = document.getElementById('phoneIcon');
      const ctx = c.getContext('2d');
      drawCircleBg(ctx);
      ctx.save();
      ctx.translate(R, R);
      ctx.strokeStyle = FG;
      ctx.fillStyle = FG;
      ctx.lineWidth = 3;
      ctx.lineCap = 'round';
      ctx.lineJoin = 'round';
      // Simple phone handset
      const s = 0.32;
      ctx.scale(s * S / 24, s * S / 24);
      ctx.translate(-12, -12);
      // Handset path
      ctx.beginPath();
      ctx.moveTo(5, 4);
      ctx.lineTo(4, 8);
      ctx.quadraticCurveTo(4, 12, 8, 16);
      ctx.quadraticCurveTo(12, 20, 16, 20);
      ctx.lineTo(20, 19);
      ctx.lineTo(20, 16);
      ctx.lineTo(17, 15);
      ctx.lineTo(15, 17);
      ctx.quadraticCurveTo(11, 16, 8, 13);
      ctx.quadraticCurveTo(6, 10, 7, 9);
      ctx.lineTo(9, 7);
      ctx.lineTo(8, 4);
      ctx.closePath();
      ctx.fill();
      ctx.restore();
    }

    // ── Email Icon ──
    function drawEmail() {
      const c = document.getElementById('emailIcon');
      const ctx = c.getContext('2d');
      drawCircleBg(ctx);
      ctx.save();
      ctx.translate(R, R);
      const w = 28, h = 20;
      ctx.strokeStyle = FG;
      ctx.lineWidth = 2.5;
      ctx.lineCap = 'round';
      ctx.lineJoin = 'round';
      // Envelope body
      ctx.strokeRect(-w/2, -h/2 + 2, w, h - 2);
      // Envelope flap (V shape)
      ctx.beginPath();
      ctx.moveTo(-w/2, -h/2 + 2);
      ctx.lineTo(0, 4);
      ctx.lineTo(w/2, -h/2 + 2);
      ctx.stroke();
      ctx.restore();
    }

    // ── Web/Globe Icon ──
    function drawWeb() {
      const c = document.getElementById('webIcon');
      const ctx = c.getContext('2d');
      drawCircleBg(ctx);
      ctx.save();
      ctx.translate(R, R);
      const r = 16;
      ctx.strokeStyle = FG;
      ctx.lineWidth = 2;
      ctx.lineCap = 'round';
      // Outer circle
      ctx.beginPath();
      ctx.arc(0, 0, r, 0, Math.PI * 2);
      ctx.stroke();
      // Horizontal line
      ctx.beginPath();
      ctx.moveTo(-r, 0);
      ctx.lineTo(r, 0);
      ctx.stroke();
      // Vertical ellipse (meridian)
      ctx.beginPath();
      ctx.ellipse(0, 0, r * 0.45, r, 0, 0, Math.PI * 2);
      ctx.stroke();
      ctx.restore();
    }

    // ── LinkedIn Icon ──
    function drawLinkedIn() {
      const c = document.getElementById('linkedinIcon');
      const ctx = c.getContext('2d');
      drawCircleBg(ctx);
      ctx.fillStyle = FG;
      ctx.font = 'bold ' + (S * 0.42) + 'px Arial';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText('in', R, R + 1);
    }

    // ── Draw all ──
    drawPhone();
    drawEmail();
    drawWeb();
    drawLinkedIn();

    // Set previews
    ['phoneIcon','emailIcon','webIcon','linkedinIcon'].forEach((id, i) => {
      const src = document.getElementById(id).toDataURL('image/png');
      document.getElementById('prev' + (i+1)).src = src;
      document.getElementById('prev' + (i+5)).src = src;
    });

    function downloadIcon(canvasId, filename) {
      const canvas = document.getElementById(canvasId);
      const link = document.createElement('a');
      link.download = filename;
      link.href = canvas.toDataURL('image/png');
      link.click();
    }

    function downloadAll() {
      ['phoneIcon','emailIcon','webIcon','linkedinIcon'].forEach((id, i) => {
        const names = ['icon-phone.png','icon-email.png','icon-web.png','icon-linkedin.png'];
        setTimeout(() => downloadIcon(id, names[i]), i * 200);
      });
    }
  </script>
</body>
</html>
